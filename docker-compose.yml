services:
  db:
    image: postgis/postgis:16-3.4
    container_name: karhutla-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karhutla_db}
      POSTGRES_USER: ${POSTGRES_USER:-karhutla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karhutla_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karhutla_user} -d ${POSTGRES_DB:-karhutla_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
